<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditProfile</title>
    <link rel="stylesheet" href="AjoutCours.css"/> 
</head>
<body>
    <div class = "app-container">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-container">
                    <img src="logo.png" alt="JavaMastery AI" class="logo">
                </div>

                <nav class="navigation">
                    <button class="nav-link active">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <span>Mes cours</span>
                    </button>
                    <button class="nav-link">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span>Chatbot</span>
                    </button>
                    <button class="nav-link">
                        <i class="fa-solid fa-gamepad"></i>
                        <span>Quizzs et jeux</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-bottom">
                <img src="chatbot.PNG" alt="Illustration" class="side-img">
            </div>
        </aside>

        <div class = "main-content">

            <h3 id = "titr">Formulaire d'ajout de cours</h3>
            <p>Veuillez remplir ce formulaire et indiquez ici les informations sur le cours à partager</p>
            <form class = "insert-cours">
                <li>
                    <label for="number">Numéro du cours</label>
                    <input type="number" id = "number" name = "number" class="cours-form">
                </li>
                <li>
                    <label for="title">titre du cours</label>
                    <input type="text" id = "title" name = "title" class="cours-form">
                </li>
                <li>
                    <label for="description">Description du cours</label>
                    <input type="text" id = "description" name = "description" class="cours-form">
                </li>
                <li>
                    <p>Déposez les slides du cours (format PDF)</p>
                    <div class = "droparea">
                        <image src = "./icone.png" id = "icone"></image>
                        <p id = "instruct">Glissez et lâchez votre fichier</p>
                        <button id ="chercheur">Chercher un fichier</button>
                        <input type = "file" id = "formfile" accept="PDF" hidden>
                    </div>
                </li>
                <li>
                    <button type ="submit" id = "submitbutton">publier</button>
                </li>
            </form>
        </div>
    </div>
    <script src = "./AjoutCours.js"></script>
</body>
