<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaMastery AI – Quizzs et jeux</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR NAV -->
   <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-container">
                    <img src="logo.png" alt="JavaMastery AI" class="logo">
                </div>

                <nav class="navigation">
                    <button class="nav-link active">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <span>Mes cours</span>
                    </button>
                    <button class="nav-link">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span>Chatbot</span>
                    </button>
                    <button class="nav-link">
                        <i class="fa-solid fa-gamepad"></i>
                        <span>Quizzs et jeux</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-bottom">
                <img src="chatbot.PNG" alt="Illustration" class="side-img">
            </div>
        </aside>


  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="page-header">
      <h1>Quizzs &amp; Jeux</h1>
      <p>Choisissez une plateforme et pratiquez Java en jouant !</p>
    </div>

    <div class="games-grid" id="games-grid">
      <!-- Cards injected by JS -->
    </div>
  </main>

  <script src="games.js"></script>
</body>
</html>
