      </div>
      <span class="logo-text">Java<span class="logo-accent">Mastery</span> AI</span>
    </div>

    <nav class="nav-menu">
      <a href="coursprincipal.html" class="nav-item" id="nav-cours">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>Mes cours</span>
      </a>

      <a href="chat-bot.html" class="nav-item" id="nav-chatbot">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      </a>

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <path d="M12 12h0M8 9v6M6 12h4M16 10h2M16 14h2"/>
        </svg>

      <img src="images/desk.png" alt="illustration bureau" class="desk-img" onerror="this.style.display='none'"/>
    </div>
  </aside>

  <!-- MAIN CONTENT -->

    <div class="page-header">
      <h1>Quizzs &amp; Jeux</h1>
      <p>Choisissez une plateforme et pratiquez Java en jouant !</p>

    <div class="games-grid" id="games-grid">
