<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="Signin.css"/>
</head>
<body>
    <div class = "perso">
    <h2 class="titre-page">
    Choisissez <span>votre personnage</span>
  </h2>

  <div class="nom-perso">
    Leo
  </div>

  <div class="stats">

    <div>
      <div class="stat-nom">Dynamique</div>
      <div class="barre">
        <div class="remplissage r1"></div>
      </div>
    </div>

    <div>
      <div class="stat-nom">Motivant</div>
      <div class="barre">
        <div class="remplissage r2"></div>
      </div>
    </div>

    <div>
      <div class="stat-nom">Stimulant </div>
      <div class="barre">
        <div class="remplissage r3"></div>
      </div>
    </div>

  </div>

  <div class="perso">
    <img src="image leo.png" alt="leo">
  </div>

  <button class="fleche gauche-fleche"></button>
  <button class="fleche droite-fleche"></button>

  <button class="btn-choisir">
    + Choisir
  </button>
    </div>
    <div class="SignIn card">
        <h1>Sign In</h1>
        <input type="email" class="SignIn input" placeholder="Adresse Email">
        <input type="text" class="SignIn input" placeholder="New username">
        <input type="password" class="SignIn input" placeholder="Password">
        <input type="password" class="SignIn input" placeholder="Confirm password">
        <button class="SignIn button">Sign in</button>
        <a href="./LogIn.html" class = "link"> Login</a>
    </div>
    
</body>
</html>
