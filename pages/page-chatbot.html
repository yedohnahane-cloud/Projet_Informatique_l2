<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JavaMastery AI</title>
    <link rel="stylesheet" href="page-chatbot.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="logo">
            <h2>JavaMastery AI</h2>
        </div>

        <nav class="menu">
            <div class="menu-item">
                <img src="logo-cours.png" alt="">
                <span>Mes cours</span>
            </div>

            <div class="menu-item active">
                <img src="logo-chatbot.png" alt="">
                <span>Chatbot</span>
            </div>

            <div class="menu-item">
                <img src="logo-jeu.png" alt="">
                <span>Quizzz et jeux</span>
            </div>
        </nav>

        <div class="sidebar-illustration">
            <img src="image.png" alt="">
        </div>
    </aside>

    <!-- Main content -->
    <main class="main">

        <div class="chat-container">

            <!-- Top right icon -->
            <div class="settings">
                <img src="icon-settings.png" alt="">
            </div>

            <!-- Center content -->
            <div class="chat-center">
                <img src="chat-box.icon.png" class="bot-icon" alt="">
                <h1>Ton assistant d'apprentissage de Java</h1>
            </div>

            <!-- Input -->
            <div class="chat-input">
                <button class="plus-btn">+</button>
                <input type="text" placeholder="Décris le quiz que tu veux générer">
                <button class="mic-btn">
                    <img src="vocal.icon.png" alt="">
                </button>
            </div>

        </div>

    </main>

</div>

</body>
</html>
