<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JavaMastery AI</title>
    <link rel="stylesheet" href="/static/css/page-cours.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <img src="/static/images/logo.png" alt="Logo JavaMastery AI">
        </div>

        <nav class="menu">
            <a href="#" class="menu-item active">
                <img src="/static/images/logo-cours.png" alt="">
                <span>Mes cours</span>
            </a>

            <a href="page-chatbot.html" class="menu-item">
                <img src="/static/images/logo-chatbot.png" alt="">
                <span>Chatbot</span>
            </a>

            <a href="#" class="menu-item">
                <img src="/static/images/logo-jeu.png" alt="">
                <span>Quizs et jeux</span>
            </a>
        </nav>

        <div class="sidebar-illustration">
            <img src="/static/images/image.png" alt="Illustration">
        </div>
    </aside>

    <main class="main">

        <section class="course-wrapper">
            <div class="quiz-top">
                <a href="quiz-debut.html" class="quiz-btn">
                    <img src="/static/images/icone-quiz.png" alt="">
                    <span>Passer le quiz</span>
                </a>
            </div>

            <div class="course-section">
                <!-- Ici tu affiches ton PDF / cours -->
            </div>
        </section>

        <div class="chatbot" id="chatbot">
            <div class="chat-body">
                <img src="/static/images/chat-box.icon.png" class="bot-icon" alt="Bot">
                <h1>Ton assistant de cours</h1>
            </div>

            <div class="chat-input">
                <button class="plus-btn" id="uploadBtn" type="button">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <input type="file" id="fileInput" hidden>

                <input type="text" id="messageInput" placeholder="Posez une question">

                <button class="send-btn" id="sendBtn" type="button">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </main>

</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

if (uploadBtn && fileInput) {
    uploadBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];

        if (file) {
            console.log("Fichier sélectionné :", file.name);
            messageInput.value = file.name;
        }
    });
}

if (sendBtn && messageInput) {
    sendBtn.addEventListener("click", () => {
        const message = messageInput.value.trim();

        if (message !== "") {
            console.log("Message envoyé :", message);
            messageInput.value = "";
        }
    });

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            sendBtn.click();
        }
    });
}
</script>

</body>
</html>
