{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Quiz - JavaMastery AI</title>
    <link rel="stylesheet" href="{% static 'css/quiz.css' %}">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="">
        </div>

        <nav class="menu">
            <a href="{% url 'subjects_page' %}" class="menu-item">
                <img src="{% static 'images/logo-cours.png' %}" alt="">
                <span>Mes cours</span>
            </a>

            <a href="{% url 'chatbot_page' %}" class="menu-item">
                <img src="{% static 'images/logo-chatbot.png' %}" alt="">
                <span>Chatbot</span>
            </a>

            <a href="{% url 'games_page' %}" class="menu-item active">
                <img src="{% static 'images/logo-jeu.png' %}" alt="">
                <span>Quizs et jeux</span>
            </a>
        </nav>

        <div class="sidebar-illustration">
            <img src="{% static 'images/image-femme.png' %}" alt="">
        </div>
    </aside>

    <main class="main">
        <div class="quiz-container">

            <div class="quiz-header">
                <div class="progress" id="progress">1/1</div>

                <div class="quiz-header-text">
                    <h2>Question <span id="question-number">01</span></h2>
                    <p id="question-text">Chargement...</p>
                </div>
            </div>

            <div class="answers" id="answers-container"></div>

            <div class="quiz-footer">
                <button id="next-btn" class="btn-next">Suivant</button>
            </div>

        </div>
    </main>

</div>

<script>
    const quizStartUrl = "{% url 'start_quiz' quiz.id %}";
    const quizSubmitUrl = "{% url 'submit_quiz' quiz.id %}";
    const quizResultUrl = "{% url 'quiz_result_page' quiz.id %}";
</script>
<script src="{% static 'js/quiz-player.js' %}"></script>

</body>
</html>
