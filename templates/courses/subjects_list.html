{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaMastery AI - Mes cours</title>
    <link rel="stylesheet" href="{% static 'css/subjects_list.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="logo">
                <img src="{% static 'images/logo.png' %}" alt="Logo JavaMastery AI">
            </div>

            <nav class="menu">
                <a href="{% url 'subjects_page' %}" class="menu-item active">
                    <img src="{% static 'images/logo-cours.png' %}" alt="">
                    <span>Mes cours</span>
                </a>

                <a href="{% url 'chatbot_page' %}" class="menu-item">
                    <img src="{% static 'images/logo-chatbot.png' %}" alt="">
                    <span>Chatbot</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="{% static 'images/logo-jeu.png' %}" alt="">
                    <span>Quizs et jeux</span>
                </a>
            </nav>

            <div class="sidebar-illustration">
                <img src="{% static 'images/image.png' %}" alt="Illustration apprentissage">
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <button class="topbar-btn" aria-label="Ouvrir le menu">
                    <i class="fa-solid fa-book-open"></i>
                </button>
            </div>

<div class="scroll-area">

    <h1 class="page-title">Choisir un cours</h1>

    <div id="subjects-grid" class="courses-grid"></div>

</div>
        </main>

    </div>

    <script>
        const grid = document.getElementById("subjects-grid");

        async function loadSubjects() {
            try {
                const response = await fetch("/courses/api/subjects/");
                const data = await response.json();

                if (!response.ok) {
                    grid.innerHTML = `<p style="color:white;">${data.error || "Erreur lors du chargement des cours."}</p>`;
                    return;
                }

                if (!data.subjects || data.subjects.length === 0) {
                    grid.innerHTML = `<p style="color:white;">Aucun cours disponible.</p>`;
                    return;
                }

                grid.innerHTML = data.subjects.map(subject => `
                    <a href="/courses/${subject.id}/chapters/">
                        <div class="course-card subject-card">
                            <div class="bulb-icon active">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div class="card-info subject-info">
                                <h3>${subject.title}</h3>
                                <p>${subject.description || "Choisissez ce cours pour voir ses chapitres."}</p>
                            </div>
                        </div>
                    </a>
                `).join("");

            } catch (error) {
                grid.innerHTML = `<p style="color:white;">Erreur réseau lors du chargement.</p>`;
                console.error(error);
            }
        }

        loadSubjects();
    </script>

</body>
</html>
