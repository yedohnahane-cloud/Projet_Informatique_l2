{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaMastery AI - Chapitres</title>
    <link rel="stylesheet" href="{% static 'css/coursprincipal.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="logo">
                <img src="{% static 'images/logo.png' %}" alt="Logo JavaMastery AI">
            </div>

            <nav class="menu">
                <a href="{% url 'subjects_page' %}" class="menu-item active">
                    <img src="{% static 'images/logo-cours.png' %}" alt="">
                    <span>Mes cours</span>
                </a>

                <a href="{% url 'chatbot_page' %}" class="menu-item">
                    <img src="{% static 'images/logo-chatbot.png' %}" alt="">
                    <span>Chatbot</span>
                </a>

                {% if request.user.role == "teacher" %}
                    <a href="{% url 'teacher_actions_page' %}" class="menu-item">
                        <img src="{% static 'images/logo-jeu.png' %}" alt="">
                        <span>Actions</span>
                    </a>
                {% else %}
<a href="{% url 'games_page' %}" class="menu-item">
    <img src="{% static 'images/logo-jeu.png' %}" alt="">
    <span>Quizs et jeux</span>
</a>
                {% endif %}
            </nav>

            <div class="sidebar-illustration">
                <img src="{% static 'images/image.png' %}" alt="Illustration apprentissage">
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <a href="{% url 'profile' %}" class="topbar-btn" aria-label="Retour aux cours">
                    <i class="fa-solid fa-chevron-down"></i>
                </a>
            </div>

            <div class="scroll-area">
                <div id="courses-grid" class="courses-grid"></div>
            </div>
        </main>

    </div>

    <script>
        const subjectId = "{{ subject_id }}";
        const grid = document.getElementById("courses-grid");

        async function loadCourses() {
            try {
                const response = await fetch(`/courses/api/subjects/${subjectId}/courses/`);
                const data = await response.json();

                if (!response.ok) {
                    grid.innerHTML = `<p style="color:white;">${data.error || "Erreur lors du chargement des chapitres."}</p>`;
                    return;
                }

                if (!data.courses || data.courses.length === 0) {
                    grid.innerHTML = `<p style="color:white;">Aucun chapitre disponible pour ce cours.</p>`;
                    return;
                }

                grid.innerHTML = data.courses.map(course => {
                    const cardClass = course.is_unlocked ? "course-card active" : "course-card locked";

                    if (course.is_unlocked) {
                        return `
                            <a href="/courses/chapters/${course.id}/view/">
                                <div class="${cardClass}">
                                    <div class="bulb-icon active">
                                        <i class="fa-solid fa-lightbulb"></i>
                                    </div>
                                    <div class="card-info">
                                        <h3>${course.title}</h3>
                                        <p>Chapitre ${course.order}</p>
                                    </div>
                                    <span class="bg-number">${course.order}</span>
                                </div>
                            </a>
                        `;
                    }

                    return `
                        <div class="${cardClass}">
                            <div class="bulb-icon">
                                <i class="fa-solid fa-lightbulb"></i>
                            </div>
                            <div class="card-info">
                                <h3>${course.title}</h3>
                                <p>Chapitre ${course.order}</p>
                                <i class="fa-solid fa-lock lock"></i>
                            </div>
                            <span class="bg-number">${course.order}</span>
                        </div>
                    `;
                }).join("");

            } catch (error) {
                grid.innerHTML = `<p style="color:white;">Erreur réseau lors du chargement.</p>`;
                console.error(error);
            }
        }

        loadCourses();
    </script>

</body>
</html>
