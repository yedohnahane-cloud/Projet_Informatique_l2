{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaMastery AI</title>
    <link rel="stylesheet" href="{% static 'css/page-cours.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="Logo JavaMastery AI">
        </div>

        <nav class="menu">
            <a href="{% url 'subjects_page' %}" class="menu-item active">
                <img src="{% static 'images/logo-cours.png' %}" alt="">
                <span>Mes cours</span>
            </a>

            <a href="{% url 'chatbot_page' %}" class="menu-item">
                <img src="{% static 'images/logo-chatbot.png' %}" alt="">
                <span>Chatbot</span>
            </a>

            {% if request.user.role == "teacher" %}
                <a href="{% url 'teacher_actions_page' %}" class="menu-item">
                    <img src="{% static 'images/logo-jeu.png' %}" alt="">
                    <span>Actions</span>
                </a>
            {% else %}
                <a href="#" class="menu-item">
                    <img src="{% static 'images/logo-jeu.png' %}" alt="">
                    <span>Quizs et jeux</span>
                </a>
            {% endif %}
        </nav>

        <div class="sidebar-illustration">
            <img src="{% static 'images/image.png' %}" alt="Illustration">
        </div>
    </aside>

    <main class="main">

        <section class="course-wrapper">
<div class="quiz-top" id="quizActions">
    <a href="#" class="quiz-btn" id="quizBtn">
        <img src="{% static 'images/icone-quiz.png' %}" alt="">
        <span>Passer le quizz</span>
    </a>

    <a href="#" class="quiz-btn" id="nextChapterBtn" hidden>
        <span>Chapitre suivant</span>
    </a>
</div>

            <div class="course-section">
                <div class="course-header">
                    <div>
                        <h1 id="courseTitle">Chargement du chapitre...</h1>
                        <p id="courseMeta">Veuillez patienter</p>
                    </div>
                </div>

                <div id="courseContent" class="course-content">
                    <div class="loading-state">Chargement du cours...</div>
                </div>
            </div>
        </section>

        <aside class="chatbot" id="chatbot">
            <div class="chat-header">
                <button class="header-icon" type="button">
                    <i class="fa-regular fa-gear"></i>
                </button>
                <button class="header-icon" type="button">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button class="header-icon" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="chat-body">
                <img src="{% static 'images/chat-box.icon.png' %}" class="bot-icon" alt="Bot">
                <h2>Ton assistant de cours</h2>
            </div>

            <div class="chat-input">
                <button class="plus-btn" id="uploadBtn" type="button">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <input type="file" id="fileInput" hidden>

                <input type="text" id="messageInput" placeholder="Posez une question">

                <button class="send-btn" id="sendBtn" type="button">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>
        </aside>

    </main>

</div>

<script>
const courseId = "{{ course_id }}";
const courseTitle = document.getElementById("courseTitle");
const courseMeta = document.getElementById("courseMeta");
const courseContent = document.getElementById("courseContent");

const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const quizBtn = document.getElementById("quizBtn");
const nextChapterBtn = document.getElementById("nextChapterBtn");

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
}

function renderPdfViewer(pdfUrl, title) {
    const encodedPdfUrl = encodeURI(pdfUrl);
    const iframeUrl = `${encodedPdfUrl}#zoom=page-width&toolbar=1&navpanes=0&scrollbar=1&view=FitH`;
    courseContent.innerHTML = `
        <div class="pdf-toolbar-custom">
            <a href="${encodedPdfUrl}" target="_blank" class="secondary-btn">
                Ouvrir le PDF
            </a>
            <a href="${encodedPdfUrl}" download class="secondary-btn">
                Télécharger le PDF
            </a>
        </div>

        <div class="pdf-viewer-wrapper">
            <iframe
                class="pdf-viewer"
                src="${iframeUrl}"
                title="${escapeHtml(title)}"
                loading="lazy">
            </iframe>
        </div>

        <div class="pdf-fallback-note">
            Si le PDF s’affiche mal dans l’aperçu, utilisez “Ouvrir le PDF”.
        </div>
    `;
}

function renderTextContent(content) {
    courseContent.innerHTML = `
        <div class="text-course-content">
            ${escapeHtml(content).replace(/\n/g, "<br>")}
        </div>
    `;
}

async function loadCourseDetail() {
    try {
        const response = await fetch(`/courses/api/student/courses/${courseId}/`);
        const data = await response.json();

        console.log("PDF URL:", data.pdf_file);

        if (!response.ok) {
            courseTitle.textContent = "Accès impossible";
            courseMeta.textContent = "";
            courseContent.innerHTML = `
                <div class="error-state">
                    ${escapeHtml(data.error || "Impossible de charger ce chapitre.")}
                </div>
            `;
            return;
        }

        courseTitle.textContent = data.title;
        courseMeta.textContent = `Chapitre ${data.order}`;

        if (quizBtn) {
            if (data.quiz_id) {
                quizBtn.href = `/quiz/${data.quiz_id}/play/`;
                quizBtn.style.opacity = "1";
                quizBtn.style.pointerEvents = "auto";
                quizBtn.querySelector("span").textContent = "Passer le quizz";
            } else {
                quizBtn.href = "#";
                quizBtn.style.opacity = "0.6";
                quizBtn.style.pointerEvents = "none";
                quizBtn.querySelector("span").textContent = "Aucun quiz disponible";
            }
        }

        if (nextChapterBtn) {
            if (data.is_completed && data.next_course_id) {
                nextChapterBtn.href = `/courses/chapters/${data.next_course_id}/view/`;
                nextChapterBtn.hidden = false;
            } else {
                nextChapterBtn.hidden = true;
            }
        }

        if (data.pdf_file) {
            renderPdfViewer(data.pdf_file, data.title);
        } else if (data.content) {
            renderTextContent(data.content);
        } else {
            courseContent.innerHTML = `
                <div class="empty-state">
                    Aucun contenu disponible pour ce chapitre.
                </div>
            `;
        }

    } catch (error) {
        courseTitle.textContent = "Erreur";
        courseMeta.textContent = "";
        courseContent.innerHTML = `
            <div class="error-state">
                Une erreur réseau est survenue pendant le chargement du cours.
            </div>
        `;
        console.error(error);
    }
}

if (uploadBtn && fileInput) {
    uploadBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) {
            messageInput.value = file.name;
        }
    });
}

if (sendBtn && messageInput) {
    sendBtn.addEventListener("click", () => {
        const message = messageInput.value.trim();
        if (message !== "") {
            console.log("Message envoyé :", message);
            messageInput.value = "";
        }
    });

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            sendBtn.click();
        }
    });
}

loadCourseDetail();
</script>

</body>
</html>
