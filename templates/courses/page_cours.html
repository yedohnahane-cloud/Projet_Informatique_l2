<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JavaMastery AI</title>
    <link rel="stylesheet" href="page-cours.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="">
            
        </div>

        <nav class="menu">
            <a href="#" class="menu-item active">
                <img src="logo-cours.png" alt="">
                <span>Mes cours</span>
            </a>

            <a href="page-chatbot.html" class="menu-item">
                <img src="logo-chatbot.png" alt="">
                <span>Chatbot</span>
            </a>

            <a href="#" class="menu-item">
                <img src="logo-jeu.png" alt="">
                <span>Quizzz et jeux</span>
            </a>
        </nav>

        <div class="sidebar-illustration">
            <img src="image.png" alt="">
        </div>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main class="main">

        <!-- ZONE COURS -->
        <section class="course-wrapper">

            <!-- BOUTON QUIZZ -->
            <div class="quiz-top">
                <button class="quiz-btn">
                    <img src="icone-quiz.png" alt="">
                    <span>Passer le quizz</span>
                </button>
            </div>

            <!-- SECTION COURS -->
<div class="course-section" id="course-section">
    <p>Chargement des cours...</p>
</div>

        </section>

        <!-- CHATBOT -->
        <div class="chatbot" id="chatbot">

            <!-- HEADER -->
            <div class="chat-header">
                <img src="retirer-chat.png" class="icon" alt="">
                <img src="delete-chat.icon.png" class="icon" id="closeChat" alt="">
            </div>

            <!-- CONTENU -->
            <div class="chat-body">
                <img src="chat-box.icon.png" class="bot-icon" alt="">
                <h1>Ton assistant de cours</h1>
            </div>

            <!-- INPUT -->
            <div class="chat-input">
                <button class="plus-btn">+</button>
                <input type="text" placeholder="Posez une question">
                <button class="mic-btn">
                    <img src="vocal.icon.png" alt="">
                </button>
            </div>

        </div>

    </main>

</div>
<script>
const chatbot = document.getElementById("chatbot");
const closeBtn = document.getElementById("closeChat");

closeBtn.onclick = () => {
    chatbot.style.display = "none";
};

const urlParams = new URLSearchParams(window.location.search);
const subjectId = urlParams.get("subject_id");

async function loadCourses() {
    const container = document.getElementById("course-section");

    if (!subjectId) {
        container.innerHTML = "<p>Aucun cours sélectionné.</p>";
        return;
    }

    try {
        const response = await fetch(`/courses/api/student/courses/?subject_id=${subjectId}`);
        const data = await response.json();

        if (!response.ok) {
            container.innerHTML = `<p>${data.error || "Erreur lors du chargement des chapitres."}</p>`;
            return;
        }

        if (!data.courses || data.courses.length === 0) {
            container.innerHTML = "<p>Aucun chapitre disponible.</p>";
            return;
        }

        container.innerHTML = "";

        data.courses.forEach(course => {
            const card = document.createElement("div");

container.classList.add("chapters-grid");

data.courses.forEach(course => {
    const card = document.createElement("div");
    card.classList.add("chapter-card");

    if (course.is_unlocked) {
        card.classList.add("unlocked");
    } else {
        card.classList.add("locked");
    }

    const action = course.is_unlocked
        ? `onclick="loadCourseDetail(${course.id})"`
        : "";

    card.innerHTML = `
        <div class="chapter-card-inner" ${action}>
            <div class="chapter-icon ${course.is_unlocked ? 'icon-active' : 'icon-locked'}">💡</div>

            <div class="chapter-text">
                <h3>${course.title}</h3>
                <p>${course.is_completed ? "Chapitre terminé" : "Chapitre à parcourir"}</p>
            </div>

            <div class="chapter-number">${course.order}</div>

            ${!course.is_unlocked ? '<div class="chapter-lock">🔒</div>' : ''}
        </div>
    `;

    container.appendChild(card);
});
        });

    } catch (error) {
        container.innerHTML = "<p>Erreur serveur.</p>";
        console.error(error);
    }
}

async function loadCourseDetail(courseId) {
    const container = document.getElementById("course-section");

    try {
        const response = await fetch(`/courses/api/student/courses/${courseId}/`);
        const data = await response.json();

        if (!response.ok) {
            container.innerHTML = `<p>${data.error || "Erreur lors du chargement du chapitre."}</p>`;
            return;
        }
        container.classList.remove("chapters-grid");

        container.innerHTML = `
            <div>
                <h2>${data.title}</h2>
                ${
                    data.pdf_file
                    ? `<iframe src="${data.pdf_file}" width="100%" height="600px" style="border:none;"></iframe>`
                    : `<p>Aucun PDF disponible</p>`
                }
                <div style="margin-top: 16px;">
                    <button onclick="loadCourses()">Retour</button>
                    <button onclick="window.location.href='/courses/'">Tous les cours</button>
                </div>
            </div>
        `;

    } catch (error) {
        container.innerHTML = "<p>Erreur serveur.</p>";
        console.error(error);
    }
}

loadCourses();
</script>





</body>
</html>
